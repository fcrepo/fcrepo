version: 2
updates:
  # Maven: the root pom aggregates every module, including fcrepo-parent
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    assignees:
      - "Surfrdan"
    labels:
      - "dependencies"
    ignore:
      # Spring and Jakarta major upgrades are planned migrations, not routine bumps
      - dependency-name: "org.springframework:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jakarta.*:*"
        update-types: ["version-update:semver-major"]
      # Keep the Jakarta EE 10 API levels; these versions belong to EE 11
      - dependency-name: "jakarta.servlet:jakarta.servlet-api"
        versions: [">= 6.1"]
      - dependency-name: "jakarta.ws.rs:jakarta.ws.rs-api"
        versions: [">= 4.0"]
      - dependency-name: "jakarta.annotation:jakarta.annotation-api"
        versions: [">= 3.0"]
      # Grizzly 4.1+ targets EE 11; Jersey 3.1 is built against Grizzly 4.0
      - dependency-name: "org.glassfish.grizzly:*"
        versions: [">= 4.1"]
    groups:
      # Batch routine minor/patch bumps into one PR; majors still get their own PR
      maven-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 1
    rebase-strategy: "auto"
    assignees:
      - "Surfrdan"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
